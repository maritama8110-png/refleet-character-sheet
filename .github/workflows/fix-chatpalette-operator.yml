name: Fix chat palette operator
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/fix-chatpalette-operator.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace success comparison operator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<={目標値}'
          new = '>={目標値}'
          count = s.count(old)
          if count == 0:
              print('No old operators found; nothing to change.')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print(f'Replaced {count} occurrence(s).')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix chat palette success operator'
          git push
